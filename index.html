<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dépenses & Budget</title>

  <!-- Icône iOS Apple Touch Icon PNG & SVG -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">

  <!-- Meta Tags PWA iOS Native -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dépenses">
  <meta name="theme-color" content="#121214">

  <!-- Manifest JSON pour Android -->
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Roboto, sans-serif;
    }

    body {
      background-color: #121214;
      color: #FFFFFF;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    .app-icon-preview {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      box-shadow: 0 16px 40px rgba(0, 122, 255, 0.4);
      margin-bottom: 24px;
      animation: float 2.5s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .loader-title {
      font-size: 24px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .loader-sub {
      font-size: 14px;
      color: #8E8E93;
      margin-bottom: 28px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #007AFF;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    // URL d'exécution réelle Google Apps Script
    var APPS_SCRIPT_EXEC_URL = "https://script.google.com/macros/s/AKfycbz5vcYT6APb__ibF7FrT8-UZt5GIaa9I50kDg3vaMj-qgtlSeHbaan8fpYBoczfFQ4v/exec";

    window.onload = function() {
      window.location.replace(APPS_SCRIPT_EXEC_URL);
    };
  </script>
</head>

<body>
  <!-- Icône 3D Wallet SVG -->
  <svg class="app-icon-preview" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <rect width="512" height="512" rx="115" fill="#121214"/>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5856D6"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <rect x="48" y="48" width="416" height="416" rx="90" fill="url(#bgGrad)"/>
    <rect x="96" y="140" width="320" height="240" rx="32" fill="#1E1E22" stroke="#3A3A42" stroke-width="12"/>
    <rect x="96" y="180" width="320" height="200" rx="28" fill="#2A2A30"/>
    <path d="M140 180 V 150 A 40 40 0 0 1 370 150 V 180" stroke="#34C759" stroke-width="24" fill="none" stroke-linecap="round"/>
    <circle cx="340" cy="280" r="24" fill="#FFCC00"/>
  </svg>

  <div class="loader-title">Dépenses & Budget</div>
  <div class="loader-sub">Ouverture sécurisée de l'application...</div>
  <div class="spinner"></div>
</body>

</html>
